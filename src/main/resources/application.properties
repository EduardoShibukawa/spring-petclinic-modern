# Spring Boot 3.4 & Java 21 Modern PetClinic Configuration

# Habilitando Virtual Threads nativas do Java 21 (Project Loom)
spring.threads.virtual.enabled=true

# Banco de dados H2 em memória para testes ultrarrápidos
spring.datasource.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true

# Inicialização automática de dados de catálogo (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Porta HTTP padrão
server.port=8080
